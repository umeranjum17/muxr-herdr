name: ci
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.claude/**'
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test build.test.mjs
      - name: Manifest matches the pinned CLI's canonical generator
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr-plugin.toml)
          sha=$(sed -n "s/^const CLI_SHA256 = '\(.*\)';$/\1/p" build.mjs)
          curl -fsSL -o cli.tgz "https://github.com/umeranjum17/muxr/releases/download/v${version}/trymuxr-cli-${version}.tgz"
          echo "${sha}  cli.tgz" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/cli" && tar -xzf cli.tgz -C "${RUNNER_TEMP}/cli"
          node "${RUNNER_TEMP}/cli/package/resources/control/check-copy.mjs" .
